appId: com.mrchen.spacetowerdefense
---
- extendedWaitUntil:
    visible: "Deploy"
    timeout: 90000
- takeScreenshot: home
- scrollUntilVisible:
    element: "Currency Shop"
    direction: DOWN
    timeout: 30000
- tapOn: "Currency Shop"
- takeScreenshot: currency-shop
- tapOn: "Home"
- tapOn: "Deploy"
- extendedWaitUntil:
    visible: "(?i)wave.*"
    timeout: 30000
- takeScreenshot: gameplay
