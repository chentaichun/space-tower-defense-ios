# Manual builds only. This first workflow validates native compilation without
# a paid Apple membership. It does not sign, upload, or release the app.
workflows:
  ios-signed-validation:
    name: Space Tower Defense - signed App Store validation
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Codemagic iOS Release 2
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mrchen.spacetowerdefense
    scripts:
      - name: Verify latest release source
        script: |
          set -euo pipefail
          npm ci
          npm run ios:prepare
          npm test
          npm run ios:verify
          node tools/verify-ios-live-version.mjs
      - name: Configure distribution signing
        script: xcode-project use-profiles
      - name: Archive and export signed IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
      - name: Verify the exported signed payload
        script: |
          set -euo pipefail
          python3 tools/verify-ios-ipa.py
    artifacts:
      - build/ios/ipa/*.ipa
      - release/ios/*verification.json
      - /tmp/xcodebuild_logs/*.log
    # Upload and App Review are intentionally separate from this validation run.
  ios-app-store-upload:
    name: Space Tower Defense - upload to App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Codemagic iOS Release 2
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mrchen.spacetowerdefense
    scripts:
      - name: Verify latest release source
        script: |
          set -euo pipefail
          npm ci
          npm run ios:prepare
          npm test
          npm run ios:verify
          node tools/verify-ios-live-version.mjs
      - name: Configure distribution signing
        script: xcode-project use-profiles
      - name: Archive and export signed IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
      - name: Verify the exported signed payload
        script: |
          set -euo pipefail
          python3 tools/verify-ios-ipa.py
    artifacts:
      - build/ios/ipa/*.ipa
      - release/ios/*verification.json
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
  ios-simulator-check:
    name: Space Tower Defense - iOS compilation check
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Prepare and verify current iOS source
        script: |
          set -euo pipefail
          npm run ios:prepare
          npm test
          npm run ios:verify
          node tools/verify-ios-live-version.mjs
      - name: Compile iOS simulator app
        script: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Verify compiled bundle identity and game assets
        script: |
          set -euo pipefail
          python3 tools/verify-ios-bundle.py build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app \
            build/ios-simulator/SpaceTowerDefense-simulator.zip
      - name: Smoke test iPhone simulator launch
        script: bash tools/ios-simulator-smoke.sh
    artifacts:
      - build/ios-simulator/SpaceTowerDefense-simulator.zip
      - release/ios/source-verification.json
      - release/ios/bundle-verification.json
      - build/ios-simulator/smoke/**
